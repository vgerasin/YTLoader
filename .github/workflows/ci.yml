name: CI

# Собирает оболочку для Apple Silicon + Intel, гоняет тесты
# и кладёт журналы в ветку ci-logs (журналы Actions снаружи не видны).
on:
  push:
    branches: [rewrite-host, main]
    paths: ["host/**", ".github/workflows/ci.yml", "scripts/**", "app/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version 2>&1 | tee host/swift-version.log

      - name: Build (universal)
        working-directory: host
        run: |
          set -o pipefail
          swift build -c release --arch arm64 --arch x86_64 2>&1 | tee build.log

      - name: Tools for end-to-end tests (yt-dlp, ffmpeg)
        if: always()
        run: |
          set +e
          {
            python3 -m pip install --break-system-packages yt-dlp || python3 -m pip install yt-dlp
            mkdir -p "$RUNNER_TEMP/bin"
            printf '#!/bin/sh\nexec python3 -m yt_dlp "$@"\n' > "$RUNNER_TEMP/bin/yt-dlp"
            chmod +x "$RUNNER_TEMP/bin/yt-dlp"
            "$RUNNER_TEMP/bin/yt-dlp" --version
            brew install ffmpeg
            ffmpeg -version | head -1
            echo "YTL_EXTRA_BIN=$RUNNER_TEMP/bin" >> "$GITHUB_ENV"
          } 2>&1 | tee host/tools.log

      - name: Test (unit + end-to-end)
        if: always()
        working-directory: host
        env:
          YTL_E2E: "1"
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log

      - name: Launch the real app (self-test)
        if: always()
        continue-on-error: true
        working-directory: host
        env:
          YTLOADER_SELFTEST: "1"
          YTLOADER_UI: ${{ github.workspace }}/app/Resources/ui.html
          YTLOADER_HOME: ${{ runner.temp }}/ytl-home
          YTLOADER_SELFTEST_OUT: ${{ github.workspace }}/host/selftest
          YTLOADER_SELFTEST_URL: http://127.0.0.1:8765/sample.mp4
        run: |
          mkdir -p "$YTLOADER_HOME" "$YTLOADER_SELFTEST_OUT"
          echo '{"onboarded":true,"autoUpdate":false,"language":"ru","theme":"light","speedLimit":"200K","cookieBrowser":"none"}' > "$YTLOADER_HOME/settings.json"
          (cd Tests/YTLoaderCoreTests/Fixtures && nohup python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          "$BIN/YTLoader" > selftest.log 2>&1 &
          PID=$!
          for i in $(seq 1 170); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          kill $PID 2>/dev/null || true
          cat selftest.log
          grep -q "SELFTEST OK" selftest.log

      - name: Publish logs
        if: always()
        run: |
          set +e
          rm -rf /tmp/logrepo
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git clone --depth 1 --branch ci-logs "$URL" /tmp/logrepo 2>/dev/null; then :; else
            mkdir /tmp/logrepo && cd /tmp/logrepo && git init -q -b ci-logs && git remote add origin "$URL"
          fi
          cd /tmp/logrepo
          rm -rf latest && mkdir latest
          for f in build test tools swift-version selftest; do cp "$GITHUB_WORKSPACE/host/$f.log" latest/ 2>/dev/null; done
          cp "$GITHUB_WORKSPACE"/host/selftest/*.png latest/ 2>/dev/null
          echo "${{ github.sha }} ${{ github.ref_name }} $(date -u +%FT%TZ)" > latest/info.txt
          git config user.name ci && git config user.email ci@example.invalid
          git add -A && git commit -q -m "logs for ${{ github.sha }}" && git push -q origin ci-logs
