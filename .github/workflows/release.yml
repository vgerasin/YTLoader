name: Release DMG

# Собирает DMG на macOS-раннере GitHub (универсальный и Intel), выкладывает их в Releases
# и обновляет готовые образы в папке downloads/.
# Запуск: вкладка Actions → «Release DMG» → Run workflow,
# либо  git tag v5.6 && git push origin v5.6

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Опубликовать релиз и обновить downloads/ (false — только собрать и проверить)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Тесты оболочки
        working-directory: host
        run: swift test

      - name: Собрать универсальный DMG (Apple Silicon + Intel)
        run: ./scripts/build-dmg.sh

      - name: Собрать DMG только для Intel
        run: ./scripts/build-dmg.sh --arch x86_64

      - name: Запустить собранное приложение (самопроверка)
        run: |
          # Настоящее окно: вставляет ссылку, качает файл с локального сервера настоящим yt-dlp из .app,
          # открывает настройки. Если приложение сломано, релиз не публикуется.
          export YTLOADER_SELFTEST=1
          export YTLOADER_HOME="$RUNNER_TEMP/ytl-home"
          export YTLOADER_SELFTEST_OUT="$RUNNER_TEMP/selftest"
          export YTLOADER_SELFTEST_URL=http://127.0.0.1:8765/sample.mp4
          mkdir -p "$YTLOADER_HOME" "$YTLOADER_SELFTEST_OUT"
          echo '{"onboarded":true,"autoUpdate":false,"language":"ru","cookieBrowser":"none"}' > "$YTLOADER_HOME/settings.json"
          (cd host/Tests/YTLoaderCoreTests/Fixtures && nohup python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          ok=0
          for attempt in 1 2; do
            build/universal/YTLoader.app/Contents/MacOS/YTLoader > selftest.log 2>&1 &
            PID=$!
            for i in $(seq 1 170); do kill -0 $PID 2>/dev/null || break; sleep 1; done
            kill $PID 2>/dev/null || true
            cat selftest.log
            if grep -q "SELFTEST OK" selftest.log; then ok=1; break; fi
            rm -rf "$YTLOADER_HOME/history.json" "$YTLOADER_HOME/queue.json"
          done
          [ "$ok" = 1 ]

      - name: Приложить снимки окна
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-shots
          path: ${{ runner.temp }}/selftest/*.png
          if-no-files-found: ignore

      - name: Проверить образы
        run: |
          ls -la dist
          lipo -archs build/universal/YTLoader.app/Contents/MacOS/YTLoader
          lipo -archs build/x86_64/YTLoader.app/Contents/MacOS/YTLoader
          lipo -archs build/universal/YTLoader.app/Contents/Resources/bin/yt-dlp || true

      - name: Приложить DMG к запуску
        uses: actions/upload-artifact@v4
        with:
          name: YTLoader-dmg
          path: dist/*.dmg

      - name: Опубликовать релиз
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v$VERSION"
          UNI="dist/YTLoader-$VERSION.dmg"
          INTEL="dist/YTLoader-$VERSION-intel.dmg"
          SHA_UNI="$(shasum -a 256 "$UNI" | cut -d' ' -f1)"
          SHA_INTEL="$(shasum -a 256 "$INTEL" | cut -d' ' -f1)"
          cat > notes.md <<NOTES
          **YTLoader-$VERSION.dmg** — универсальный образ: Apple Silicon (M1 и новее) и Intel, macOS 12 и новее.
          **YTLoader-$VERSION-intel.dmg** — то же приложение только для Intel-маков.

          Приложение подписано без аккаунта разработчика: при первом запуске нажмите правой кнопкой → «Открыть».

          SHA-256:
          - \`$SHA_UNI\` — YTLoader-$VERSION.dmg
          - \`$SHA_INTEL\` — YTLoader-$VERSION-intel.dmg
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$UNI" "$INTEL" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "$UNI" "$INTEL" \
              --title "YTLoader $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          fi

      - name: Обновить готовые образы в downloads/
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git switch -C main origin/main
          rm -f downloads/*.dmg downloads/*.sha256 downloads/SHA256SUMS
          mkdir -p downloads
          cp dist/*.dmg downloads/
          (cd downloads && shasum -a 256 *.dmg > SHA256SUMS)
          git add downloads
          if git diff --cached --quiet; then echo "без изменений"; else
            git commit -m "Образы $(tr -d '[:space:]' < VERSION) в downloads/"
            git push origin main
          fi
