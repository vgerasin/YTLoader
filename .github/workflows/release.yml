name: Release DMG

# Собирает DMG на macOS-раннере GitHub и выкладывает его в Releases.
# Запуск: вкладка Actions → «Release DMG» → Run workflow,
# либо git tag v4.7 && git push origin v4.7

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Собрать DMG
        run: make dmg

      - name: Приложить DMG к запуску
        uses: actions/upload-artifact@v4
        with:
          name: YTLoader-dmg
          path: dist/*.dmg

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v$VERSION"
          SHA="$(shasum -a 256 dist/YTLoader-$VERSION.dmg | cut -d' ' -f1)"
          cat > notes.md <<NOTES
          Для Mac на Apple Silicon, macOS 12 и новее.

          Приложение подписано без аккаунта разработчика: при первом запуске нажмите правой кнопкой → «Открыть».

          SHA-256: \`$SHA\`
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/YTLoader-$VERSION.dmg" --clobber
          else
            gh release create "$TAG" "dist/YTLoader-$VERSION.dmg" \
              --title "YTLoader $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          fi
